<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Serverless Items App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; }
    .item { border: 1px solid #ddd; padding: 10px; margin: 5px 0; }
    .item span { display: inline-block; min-width: 200px; }
    button { margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Serverless Items App</h1>

  <div>
    <input id="titleInput" placeholder="Item title" />
    <select id="statusInput">
      <option value="PENDING">PENDING</option>
      <option value="DONE">DONE</option>
    </select>
    <button onclick="createItem()">Add</button>
  </div>

  <h2>Items</h2>
  <div id="itemsContainer"></div>

  <script>
    // 🔴 If your stage name or API ID is different, update this URL
    const API_BASE = "https://62a2alj6i.execute-api.ap-south-1.amazonaws.com/prod/items";

    async function fetchItems() {
      try {
        const res = await fetch(API_BASE);
        const data = await res.json();
        renderItems(data);
      } catch (err) {
        console.error("Error fetching items:", err);
        alert("Failed to load items. Check console for details.");
      }
    }

    async function createItem() {
      const title = document.getElementById("titleInput").value;
      const status = document.getElementById("statusInput").value;
      if (!title) {
        alert("Title required");
        return;
      }

      try {
        await fetch(API_BASE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, status }),
        });

        document.getElementById("titleInput").value = "";
        fetchItems();
      } catch (err) {
        console.error("Error creating item:", err);
        alert("Failed to create item.");
      }
    }

    async function deleteItem(id) {
      try {
        await fetch(`${API_BASE}/${id}`, { method: "DELETE" });
        fetchItems();
      } catch (err) {
        console.error("Error deleting item:", err);
        alert("Failed to delete item.");
      }
    }

    function renderItems(items) {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";
      (items || []).forEach((item) => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <span><b>${item.title}</b> [${item.status}]</span>
          <button onclick="deleteItem('${item.ID}')">Delete</button>
        `;
        container.appendChild(div);
      });
    }

    // Load items on page load
    fetchItems();
  </script>
</body>
</html>
